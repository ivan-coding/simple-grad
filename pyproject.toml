[project]
name = "simple-grad"
version = "0.1.0"
description = "A from-scratch scalar autograd engine and tiny neural network library"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["graphviz>=0.20"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
